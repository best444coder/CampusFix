<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Details</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/student-nav}"></div><main class="container page"><div class="page-head"><div><h1 th:text="'Complaint #' + ${complaint.complaintId}">Complaint #CF1024</h1><p style="color:#667085" th:text="${complaint.title}">Problem</p></div><span class="badge" th:classappend="${complaint.status == 'Pending'} ? ' pending' : (${complaint.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${complaint.status}">In Progress</span></div>
<div class="card"><div class="details-grid"><div class="detail"><small>Problem</small><strong th:text="${complaint.title}"></strong></div><div class="detail"><small>Category</small><strong th:text="${complaint.category}"></strong></div><div class="detail"><small>Location</small><strong th:text="${complaint.building + ' — ' + complaint.roomNumber}"></strong></div><div class="detail"><small>Department</small><strong th:text="${complaint.department}"></strong></div><div class="detail"><small>Submitted</small><strong th:text="${#temporals.format(complaint.submittedAt,'dd MMM yyyy, hh:mm a')}"></strong></div></div>
<div style="margin-top:20px"><small style="color:#667085">Description</small><p th:text="${complaint.description}" style="line-height:1.7"></p></div>
<img th:if="${complaint.imagePath}" th:src="${complaint.imagePath}" style="max-width:400px;max-height:300px;border-radius:12px;object-fit:cover">
<div class="timeline"><div class="step" th:classappend="${complaint.status == 'Pending' or complaint.status == 'In Progress' or complaint.status == 'Resolved'} ? ' done'"><div class="dot"></div><p>Pending</p></div><div class="step" th:classappend="${complaint.status == 'In Progress' or complaint.status == 'Resolved'} ? ' done'"><div class="dot"></div><p>In Progress</p></div><div class="step" th:classappend="${complaint.status == 'Resolved'} ? ' done'"><div class="dot"></div><p>Resolved</p></div></div>
<div th:if="${complaint.resolutionNotes}" class="detail"><small>Admin / Resolution Notes</small><strong th:text="${complaint.resolutionNotes}"></strong></div>
<div th:if="${complaint.status == 'Resolved'}" style="margin-top:18px;padding:15px;background:#ecfdf3;color:#15803d;border-radius:10px;font-weight:700">Your complaint has been resolved.</div>
</div></main></body></html>
