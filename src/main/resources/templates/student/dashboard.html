<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Student Dashboard</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/student-nav}"></div><div class="sidebar-layout"><aside class="sidebar"><a class="active" href="/student/dashboard">Dashboard</a><a href="/student/report">Report a Problem</a><a href="/student/complaints">My Complaints</a><a href="/student/notifications">Notifications</a></aside>
<main class="main"><div class="page-head"><div><h1>Good to see you, <span th:text="${user.name}">Student</span> 👋</h1><p style="color:#667085">Track and manage your campus complaints.</p></div><a class="btn" href="/student/report">+ Report a Problem</a></div>
<div class="cards"><div class="stat"><small>Total Complaints</small><strong th:text="${total}">0</strong></div><div class="stat"><small>Pending</small><strong th:text="${pending}">0</strong></div><div class="stat"><small>In Progress</small><strong th:text="${progress}">0</strong></div><div class="stat"><small>Resolved</small><strong th:text="${resolved}">0</strong></div></div>
<div class="card"><div class="page-head"><h2>Recent Complaints</h2><a href="/student/complaints" style="color:#2563eb;font-weight:700">View all</a></div>
<div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Problem</th><th>Category</th><th>Location</th><th>Status</th><th></th></tr></thead><tbody>
<tr th:each="c : ${complaints}"><td th:text="${c.complaintId}">CF1024</td><td th:text="${c.title}">Problem</td><td th:text="${c.category}">Category</td><td th:text="${c.building + ' — ' + c.roomNumber}">Block</td><td><span class="badge" th:classappend="${c.status == 'Pending'} ? ' pending' : (${c.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${c.status}">In Progress</span></td><td><a class="btn secondary" th:href="@{'/student/complaint/' + ${c.complaintId}}">Open</a></td></tr>
</tbody></table></div></div></main></div></body></html>
