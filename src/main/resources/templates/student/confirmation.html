<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Complaint Submitted</title><link rel="stylesheet" href="/css/style.css"></head>
<body><div th:replace="~{fragments/student-nav}"></div><main class="container page"><div class="form-card" style="max-width:700px;margin:50px auto;text-align:center"><div style="font-size:48px">✓</div><h1>Complaint submitted successfully!</h1><p style="color:#667085">Your complaint has been registered and sent to the appropriate department.</p><div class="details-grid" style="text-align:left;margin:25px 0"><div class="detail"><small>Complaint ID</small><strong th:text="${complaint.complaintId}">CF1024</strong></div><div class="detail"><small>Category</small><strong th:text="${complaint.category}">Laboratory</strong></div><div class="detail"><small>Location</small><strong th:text="${complaint.building + ' — ' + complaint.roomNumber}">Block B — Lab 2</strong></div><div class="detail"><small>Current Status</small><span class="badge pending">Pending</span></div></div><a class="btn" th:href="@{'/student/complaint/' + ${complaint.complaintId}}">Track Complaint</a><a class="btn secondary" href="/student/dashboard" style="margin-left:8px">Dashboard</a></div></main></body></html>
