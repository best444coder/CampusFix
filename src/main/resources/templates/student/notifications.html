<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Notifications</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/student-nav}"></div><div class="sidebar-layout"><aside class="sidebar"><a href="/student/dashboard">Dashboard</a><a href="/student/report">Report a Problem</a><a href="/student/complaints">My Complaints</a><a class="active" href="/student/notifications">Notifications</a></aside><main class="main"><h1>Notifications</h1><p style="color:#667085">Updates about your complaints.</p><div style="margin-top:20px"><div class="notification" th:each="n:${notifications}"><strong th:text="${n.message}">Complaint update</strong><small th:text="${#temporals.format(n.createdAt,'dd MMM yyyy, hh:mm a')}">27 Aug</small></div><div class="empty" th:if="${#lists.isEmpty(notifications)}">No notifications yet.</div></div></main></div></body></html>
