<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Complaints</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/student-nav}"></div><div class="sidebar-layout"><aside class="sidebar"><a href="/student/dashboard">Dashboard</a><a href="/student/report">Report a Problem</a><a class="active" href="/student/complaints">My Complaints</a><a href="/student/notifications">Notifications</a></aside><main class="main">
<div class="page-head"><div><h1>My Complaints</h1><p style="color:#667085">Your complete complaint history.</p></div><a class="btn" href="/student/report">+ New Complaint</a></div>
<div class="table-wrap"><table class="table"><thead><tr><th>Complaint ID</th><th>Problem</th><th>Category</th><th>Location</th><th>Department</th><th>Date</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c:${complaints}">
<td th:text="${c.complaintId}">CF1024</td><td th:text="${c.title}">Problem</td><td th:text="${c.category}">Lab</td><td th:text="${c.building + ' — ' + c.roomNumber}">Block</td><td th:text="${c.department}">IT</td><td th:text="${#temporals.format(c.submittedAt,'dd MMM yyyy')}">27 Aug</td><td><span class="badge" th:classappend="${c.status == 'Pending'} ? ' pending' : (${c.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${c.status}">Pending</span></td><td><a class="btn secondary" th:href="@{'/student/complaint/' + ${c.complaintId}}">View</a></td>
</tr></tbody></table></div></main></div></body></html>
