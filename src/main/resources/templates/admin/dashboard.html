<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Admin Dashboard</title><link rel="stylesheet" href="/css/style.css"><script src="https://cdn.jsdelivr.net/npm/chart.js"></script></head><body>
<div th:replace="~{fragments/admin-nav}"></div><div class="sidebar-layout"><aside class="sidebar"><a class="active" href="/admin/dashboard">Dashboard</a><a href="/admin/complaints">Manage Complaints</a></aside><main class="main">
<div class="page-head"><div><h1>Admin Dashboard</h1><p style="color:#667085">Campus complaint overview and operations.</p></div><a class="btn" href="/admin/complaints">Manage Complaints</a></div>
<div class="cards"><div class="stat"><small>Total Complaints</small><strong th:text="${total}">0</strong></div><div class="stat"><small>Pending</small><strong th:text="${pending}">0</strong></div><div class="stat"><small>In Progress</small><strong th:text="${progress}">0</strong></div><div class="stat"><small>Resolved</small><strong th:text="${resolved}">0</strong></div></div>
<div class="grid2"><div class="card"><h3>Complaints by Category</h3><div class="chart-box"><canvas id="categoryChart"></canvas></div></div><div class="card"><h3>Complaints by Status</h3><div class="chart-box"><canvas id="statusChart"></canvas></div></div></div>
<div class="card" style="margin-top:20px"><div class="page-head"><h2>Recent Complaints</h2><a href="/admin/complaints" style="color:#2563eb;font-weight:700">View all</a></div><div class="table-wrap"><table class="table"><thead><tr><th>ID</th><th>Problem</th><th>Category</th><th>Department</th><th>Status</th><th></th></tr></thead><tbody><tr th:each="c:${complaints}" th:if="${cStat.index < 6}"><td th:text="${c.complaintId}"></td><td th:text="${c.title}"></td><td th:text="${c.category}"></td><td th:text="${c.department}"></td><td><span class="badge" th:classappend="${c.status == 'Pending'} ? ' pending' : (${c.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${c.status}"></span></td><td><a class="btn secondary" th:href="@{'/admin/complaint/' + ${c.complaintId}}">Open</a></td></tr></tbody></table></div></div>
<script th:inline="javascript">
const category = /*[[${categoryJson}]]*/ '{}'; const status = /*[[${statusJson}]]*/ '{}';
new Chart(document.getElementById('categoryChart'),{type:'bar',data:{labels:Object.keys(category),datasets:[{label:'Complaints',data:Object.values(category)}]},options:{responsive:true,maintainAspectRatio:false}});
new Chart(document.getElementById('statusChart'),{type:'doughnut',data:{labels:Object.keys(status),datasets:[{data:Object.values(status)}]},options:{responsive:true,maintainAspectRatio:false}});
</script></main></div></body></html>
