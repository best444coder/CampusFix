<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Complaint</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/admin-nav}"></div><main class="container page"><div class="page-head"><div><h1 th:text="'Complaint #' + ${complaint.complaintId}">Complaint</h1><p th:text="${complaint.title}" style="color:#667085">Problem</p></div><span class="badge" th:classappend="${complaint.status == 'Pending'} ? ' pending' : (${complaint.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${complaint.status}"></span></div>
<div class="grid2"><div class="card"><h2>Complaint Details</h2><div class="details-grid"><div class="detail"><small>Student</small><strong th:text="${complaint.student.name}"></strong></div><div class="detail"><small>Category</small><strong th:text="${complaint.category}"></strong></div><div class="detail"><small>Location</small><strong th:text="${complaint.building + ' — ' + complaint.roomNumber}"></strong></div><div class="detail"><small>Submitted</small><strong th:text="${#temporals.format(complaint.submittedAt,'dd MMM yyyy, hh:mm a')}"></strong></div></div><h3>Description</h3><p th:text="${complaint.description}" style="line-height:1.7"></p><img th:if="${complaint.imagePath}" th:src="${complaint.imagePath}" style="max-width:100%;max-height:300px;border-radius:12px"></div>
<div class="card"><h2>Update Complaint</h2><form method="post" th:action="@{'/admin/complaint/' + ${complaint.complaintId} + '/update'}"><div class="field" style="margin-bottom:14px"><label>Assign Department</label><select name="department"><option>IT Support</option><option>Electrical Maintenance</option><option>Civil & Maintenance</option><option>Facilities</option><option>General Administration</option></select></div><div class="field" style="margin-bottom:14px"><label>Status</label><select name="status"><option>Pending</option><option>In Progress</option><option>Resolved</option></select></div><div class="field"><label>Resolution Remarks</label><textarea name="notes" placeholder="Add resolution notes..."></textarea></div><button class="btn" style="margin-top:16px">Save Update</button></form></div></div></main></body></html>
