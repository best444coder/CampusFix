<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Manage Complaints</title><link rel="stylesheet" href="/css/style.css"></head><body>
<div th:replace="~{fragments/admin-nav}"></div><div class="sidebar-layout"><aside class="sidebar"><a href="/admin/dashboard">Dashboard</a><a class="active" href="/admin/complaints">Manage Complaints</a></aside><main class="main">
<div class="page-head"><div><h1>Complaint Management</h1><p style="color:#667085">Search, filter, assign and update complaints.</p></div></div>
<form class="filters" method="get"><input name="search" th:value="${param.search}" placeholder="Search ID, problem, location...">
<select name="category"><option value="">All Categories</option><option th:each="c:${allComplaints.![category]}" th:value="${c}" th:text="${c}" th:selected="${c == selectedCategory}"></option></select>
<select name="department"><option value="">All Departments</option><option th:each="d:${allComplaints.![department]}" th:value="${d}" th:text="${d}" th:selected="${d == selectedDepartment}"></option></select>
<select name="status"><option value="">All Statuses</option><option>Pending</option><option>In Progress</option><option>Resolved</option></select><button class="btn">Apply Filters</button><a class="btn secondary" href="/admin/complaints">Clear</a></form>
<div class="table-wrap"><table class="table"><thead><tr><th>Complaint ID</th><th>Problem</th><th>Category</th><th>Location</th><th>Department</th><th>Date</th><th>Status</th><th>Action</th></tr></thead><tbody><tr th:each="c:${complaints}">
<td th:text="${c.complaintId}"></td><td th:text="${c.title}"></td><td th:text="${c.category}"></td><td th:text="${c.building + ' — ' + c.roomNumber}"></td><td th:text="${c.department}"></td><td th:text="${#temporals.format(c.submittedAt,'dd MMM yyyy')}"></td><td><span class="badge" th:classappend="${c.status == 'Pending'} ? ' pending' : (${c.status == 'Resolved'} ? ' resolved' : ' inprogress')" th:text="${c.status}"></span></td><td><a class="btn secondary" th:href="@{'/admin/complaint/' + ${c.complaintId}}">Manage</a></td>
</tr></tbody></table></div></main></div></body></html>
